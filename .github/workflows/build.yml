name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Uloz pliki w foldery
        run: |
          set -e
          J=src/main/java/pl/autoreroll
          R=src/main/resources
          mkdir -p $J/mixin $R/assets/autoreroll/lang
          mv_file() {
            if [ -f "$2/$1" ]; then return 0; fi
            p=$(find . -name "$1" -not -path "./.git/*" -not -path "./.github/*" | head -1)
            if [ -z "$p" ]; then echo "BRAK PLIKU: $1"; exit 1; fi
            mv "$p" "$2/$1"
          }
          mv_file AutoRerollClient.java $J
          mv_file RerollConfig.java $J
          mv_file RerollConfigScreen.java $J
          mv_file License.java $J
          mv_file HandledScreenMixin.java $J/mixin
          mv_file fabric.mod.json $R
          mv_file autoreroll.mixins.json $R
          mv_file en_us.json $R/assets/autoreroll/lang
          for f in build.gradle settings.gradle gradle.properties; do
            [ -f "$f" ] || { echo "BRAK PLIKU: $f"; exit 1; }
          done

      - name: Build
        run: gradle build --no-daemon

      - name: Sprawdz jar
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q fabric.mod.json
          unzip -l "$JAR" | grep -q AutoRerollClient.class
          mkdir -p out
          cp "$JAR" out/autoreroll.jar

      - name: Release z samym jarem
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-latest
          name: AutoReroll (najnowszy build)
          files: out/autoreroll.jar
